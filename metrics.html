<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>IponPal v2 — Metrics</title>
<!--
  ================================================================
  IponPal v2 metrics dashboard.  Admin-only.  Reads the SAME Supabase
  project as the app.  Rewritten for v2: the old Launch-Week Scoreboard
  tracked things v2 removed (viral-K, Barkada, badges, XP).  This tracks
  the v2 funnel instead.

  PRINCIPLES (kept from your engineering notes):
   - SIGNAL metrics (actionable) are separated from VANITY (demoted).
   - No rate is shown until MIN_SAMPLE users exist (default 5).
   - Honest empty states — never a hardcoded number pretending to be data.
   - Network-first — this is a fresh page, nothing is cached.

  TWO ASSUMPTIONS you may need to adjust when you test at home:
   1. AUTH: signs in with an email one-time code, then reads all rows.
      This requires an RLS policy that lets YOUR admin email SELECT every
      row of `events` and `profiles` (not just your own).  If your policy
      only exposes own rows, the numbers will look like a single user —
      add an admin policy, or expose SECURITY DEFINER aggregate RPCs and
      swap fetchAll() below to call them.
   2. SCHEMA: events = { owner, client_user_id, type, payload(jsonb), ts },
      profiles = { id, profile(jsonb: income_monthly, recurring[]), ... }.
      Confirmed from the app's sync code; change the column names here if
      your tables differ.
  ================================================================
-->
<style>
  :root{
    --bg:#F5F7F4; --card:#FFFFFF; --card2:#ECF0EA; --line:#E8ECE6;
    --ink:#16211A; --ink2:#41493F; --muted:#68705F;
    --green:#0E8A5F; --green-soft:rgba(14,138,95,.10);
    --violet:#6847E8; --violet-soft:rgba(104,71,232,.10);
    --amber:#B07C13; --amber-soft:rgba(176,124,19,.12);
    --red:#C4485E;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --bg:#0F1613; --card:#171E1A; --card2:#1F2723; --line:rgba(255,255,255,.12);
    --ink:#E8ECE6; --ink2:#B4BEB7; --muted:#9AA394;
    --green:#3FCF9A; --green-soft:rgba(18,164,114,.16);
    --violet:#A48BFF; --violet-soft:rgba(104,71,232,.20);
    --amber:#EAC77A; --amber-soft:rgba(176,124,19,.18); --red:#E8808F;
  }}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Onest","Helvetica Neue",system-ui,sans-serif;font-size:15px;line-height:1.5;
    padding:18px 16px calc(40px + env(safe-area-inset-bottom,0px));}
  .wrap{max-width:900px;margin:0 auto}
  h1{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:0}
  .num{font-variant-numeric:tabular-nums}
  .muted{color:var(--muted)}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  button{font-family:inherit;cursor:pointer}
  .btn{appearance:none;border:1.5px solid var(--green);background:var(--green);color:#fff;
    font-weight:700;font-size:14px;padding:10px 16px;border-radius:10px}
  .btn.ghost{background:transparent;color:var(--green)}
  input{font-family:inherit;font-size:16px;padding:11px 13px;border:1.5px solid var(--line);
    border-radius:10px;background:var(--card);color:var(--ink);width:100%;outline:none}
  input:focus{border-color:var(--violet)}

  /* login */
  #login{max-width:380px;margin:8vh auto 0}
  #login .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
  #login .field{margin-top:12px}
  #login label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:6px}
  .err{color:var(--red);font-size:13px;margin-top:10px;font-weight:600}
  .ok{color:var(--green);font-size:13px;margin-top:10px;font-weight:600}

  /* dashboard */
  .toolbar{gap:8px;flex-wrap:wrap;margin:14px 0 18px}
  .seg{display:inline-flex;gap:2px;background:var(--card2);padding:3px;border-radius:9px}
  .seg button{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:13px;padding:6px 12px;border-radius:7px}
  .seg button[aria-pressed="true"]{background:var(--card);color:var(--ink)}

  .goal{background:var(--violet-soft);border:1px solid transparent;border-radius:14px;padding:16px 18px;margin-bottom:18px}
  .goal .bar{height:9px;border-radius:99px;background:var(--card2);overflow:hidden;margin-top:10px}
  .goal .bar>div{height:100%;background:var(--violet);border-radius:99px;transition:width .4s}

  .sec-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800;margin:22px 2px 10px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px}
  .kpi .lab{font-size:12.5px;font-weight:700;color:var(--muted)}
  .kpi .big{font-size:30px;font-weight:800;letter-spacing:-.02em;margin-top:4px}
  .kpi .sub{font-size:12px;color:var(--muted);margin-top:3px}
  .kpi.signal{border-left:3px solid var(--green)}
  .kpi.thin{opacity:.75}
  .tag{display:inline-block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;
    padding:2px 7px;border-radius:99px;margin-left:6px;vertical-align:middle}
  .tag.sig{background:var(--green-soft);color:var(--green)}
  .tag.van{background:var(--amber-soft);color:var(--amber)}
  .empty{color:var(--muted);font-size:12.5px;font-weight:600;margin-top:4px}

  .funnel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
  .fstep{margin-top:10px}
  .fstep:first-child{margin-top:0}
  .fstep .row{align-items:baseline}
  .fstep .fb{height:12px;border-radius:6px;background:var(--green);margin-top:5px;min-width:2px;transition:width .4s}
  .src{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
  .src:first-child{border-top:0}
  .src b{font-variant-numeric:tabular-nums}
  .src.sweldo{color:var(--violet);font-weight:700}
  footer{margin-top:26px;font-size:11.5px;color:var(--muted);line-height:1.6;border-top:1px solid var(--line);padding-top:14px}
  code{font-family:ui-monospace,Menlo,monospace;font-size:11px;background:var(--card2);padding:1px 5px;border-radius:4px}
  [hidden]{display:none!important}
</style>
</head>
<body>

<div class="wrap">

  <!-- LOGIN -->
  <div id="login">
    <div class="card">
      <h1>IponPal v2 — Metrics</h1>
      <p class="muted" style="font-size:13px;margin-top:6px">Admin only. Sign in with your IponPal email.</p>
      <div class="field" id="step-email">
        <label for="email">Admin email</label>
        <input id="email" type="email" inputmode="email" autocomplete="email" placeholder="you@email.com">
        <button class="btn" style="margin-top:12px;width:100%" id="send">Send me a code</button>
      </div>
      <div class="field" id="step-code" hidden>
        <label for="code">6-digit code (check your email)</label>
        <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="123456">
        <button class="btn" style="margin-top:12px;width:100%" id="verify">Verify & open dashboard</button>
        <button class="btn ghost" style="margin-top:8px;width:100%" id="startover">Use a different email</button>
      </div>
      <div class="err" id="login-err" hidden></div>
      <div class="ok" id="login-ok" hidden></div>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dash" hidden>
    <div class="row" style="flex-wrap:wrap;gap:10px">
      <h1>IponPal v2 — Metrics</h1>
      <div class="row" style="gap:8px">
        <button class="btn ghost" id="refresh">Refresh</button>
        <button class="btn ghost" id="signout">Sign out</button>
      </div>
    </div>

    <div class="row toolbar">
      <div class="seg" id="period" role="group" aria-label="Period">
        <button data-d="7"  aria-pressed="false">7 days</button>
        <button data-d="28" aria-pressed="true">28 days</button>
        <button data-d="90" aria-pressed="false">90 days</button>
        <button data-d="0"  aria-pressed="false">All time</button>
      </div>
      <span class="muted" id="lastload" style="font-size:12px"></span>
    </div>

    <div id="loading" class="muted">Loading your data…</div>

    <div id="report" hidden>
      <!-- primary goal -->
      <div class="goal">
        <div class="row">
          <span style="font-weight:800">Primary goal — activated users</span>
          <span class="num" style="font-weight:800" id="goal-count">—</span>
        </div>
        <div class="bar"><div id="goal-bar" style="width:0%"></div></div>
        <p class="muted" style="font-size:12px;margin:8px 0 0" id="goal-note"></p>
      </div>

      <div class="sec-label">Signal — the v2 funnel <span class="tag sig">act on these</span></div>
      <div class="grid" id="signal"></div>

      <div class="sec-label">Retention <span class="tag sig">signal</span></div>
      <div class="grid" id="retention"></div>

      <div class="sec-label">Funnel</div>
      <div class="funnel" id="funnel"></div>

      <div class="sec-label">Where users come from</div>
      <div class="funnel" id="sources"></div>

      <div class="sec-label">Vanity — watch, don't steer by these <span class="tag van">vanity</span></div>
      <div class="grid" id="vanity"></div>
    </div>

    <footer id="foot"></footer>
  </div>

</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

/* Same project as the app. anon (publishable) key — safe in a client; RLS is what gates data. */
const SB = { url:'https://anbmihwvzbazjjufdnse.supabase.co', anonKey:'sb_publishable_acsXJGzbpvyTabyTKEQtDw_61dPw0vG' };
const MIN_SAMPLE = 5;         // no rate shown below this many users (your rule)
const GOAL_TARGET = null;     // set a number when you've picked a v2 target; null = "no target set yet"

const sb = createClient(SB.url, SB.anonKey);
const $ = id => document.getElementById(id);
const peso = n => '₱' + Math.round(n).toLocaleString('en-PH');
const pct = (a,b) => b>0 ? Math.round((a/b)*1000)/10 : 0;
const parseTs = t => new Date(String(t||'').replace(' ','T'));
const DAY = 86400000;

/* ---------------- auth (email one-time code) ---------------- */
function showErr(m){ $('login-err').textContent=m; $('login-err').hidden=!m; if(m) $('login-ok').hidden=true; }
function showOk(m){ $('login-ok').textContent=m; $('login-ok').hidden=!m; if(m) $('login-err').hidden=true; }

$('send').addEventListener('click', async () => {
  const email = $('email').value.trim();
  if(!email){ showErr('Enter your email.'); return; }
  $('send').disabled = true; showErr(''); showOk('Sending…');
  const { error } = await sb.auth.signInWithOtp({ email, options:{ shouldCreateUser:false } });
  $('send').disabled = false;
  if(error){ showErr(error.message + ' — if this is a new email, your Supabase auth settings may block sign-up.'); return; }
  showOk('Code sent. Check your inbox.');
  $('step-email').hidden = true; $('step-code').hidden = false; $('code').focus();
});
$('verify').addEventListener('click', async () => {
  const email = $('email').value.trim(), token = $('code').value.trim();
  if(!token){ showErr('Enter the code.'); return; }
  $('verify').disabled = true; showErr(''); showOk('Verifying…');
  const { error } = await sb.auth.verifyOtp({ email, token, type:'email' });
  $('verify').disabled = false;
  if(error){ showErr(error.message); return; }
  boot();
});
$('startover').addEventListener('click', () => { $('step-code').hidden=true; $('step-email').hidden=false; showErr(''); showOk(''); });
$('signout').addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });

/* ---------------- data ---------------- */
async function fetchAll(){
  // Page through events so a large table still loads fully.
  let events = [], from = 0, size = 1000;
  for(;;){
    const { data, error } = await sb.from('events').select('owner,type,payload,ts').range(from, from+size-1);
    if(error) throw error;
    events = events.concat(data||[]);
    if(!data || data.length < size) break;
    from += size;
    if(from > 500000) break; // safety
  }
  const { data:profiles, error:pe } = await sb.from('profiles').select('id,profile,updated_at');
  if(pe) throw pe;
  return { events, profiles: profiles||[] };
}

/* ---------------- metrics ---------------- */
function compute(events, profiles, days){
  const now = Date.now();
  const since = days>0 ? now - days*DAY : 0;
  const inPeriod = ts => parseTs(ts).getTime() >= since;

  // first-seen per owner (proxy for signup), from all events
  const firstSeen = new Map();
  for(const e of events){
    const t = parseTs(e.ts).getTime();
    if(!firstSeen.has(e.owner) || t < firstSeen.get(e.owner)) firstSeen.set(e.owner, t);
  }
  const allOwners = new Set([...firstSeen.keys(), ...profiles.map(p=>p.id)]);
  const totalUsers = allOwners.size;
  const newUsers = [...firstSeen.entries()].filter(([,t]) => t>=since).map(([o])=>o);

  // activation: an owner who logged >=1 expense (ever)
  const activatedSet = new Set(events.filter(e=>e.type==='expense_logged').map(e=>e.owner));
  const activated = activatedSet.size;

  // decoder usage: income_updated via the payday decoder (v2)
  const decoderSet = new Set(events.filter(e=>e.type==='income_updated' && e.payload && e.payload.via==='payday_decoder').map(e=>e.owner));

  // committed bills set: a profile carrying >=1 recurring item
  const committedSet = new Set(profiles.filter(p=>p.profile && Array.isArray(p.profile.recurring) && p.profile.recurring.length>0).map(p=>p.id));

  // acquisition by source (first 'acquired' event's utm_source per owner)
  const srcByOwner = new Map();
  for(const e of events){
    if(e.type!=='acquired') continue;
    if(srcByOwner.has(e.owner)) continue;
    const s = (e.payload && (e.payload.utm_source || e.payload.ref)) || 'direct';
    srcByOwner.set(e.owner, String(s).toLowerCase());
  }
  const sources = {};
  for(const o of allOwners){ const s = srcByOwner.get(o) || 'direct'; sources[s] = (sources[s]||0)+1; }
  const sweldoRefs = Object.entries(sources).filter(([s])=>s.includes('sweldo')).reduce((a,[,n])=>a+n,0);

  // retention D1 / D7 (cohort by first-seen day; active = any event that day)
  const activeDays = new Map(); // owner -> Set(dayIndex)
  for(const e of events){
    const d = Math.floor(parseTs(e.ts).getTime()/DAY);
    if(!activeDays.has(e.owner)) activeDays.set(e.owner, new Set());
    activeDays.get(e.owner).add(d);
  }
  function retention(n){
    let eligible=0, retained=0;
    for(const [o, t0] of firstSeen){
      const d0 = Math.floor(t0/DAY);
      if((now/DAY) - d0 < n+1) continue;      // not old enough to measure day-n yet
      eligible++;
      const set = activeDays.get(o);
      if(set && set.has(d0+n)) retained++;
    }
    return { eligible, retained, rate: eligible>=MIN_SAMPLE ? pct(retained,eligible) : null };
  }

  // engagement + vanity
  const opens = events.filter(e=>e.type==='app_open' && inPeriod(e.ts)).length;
  const expensesPeriod = events.filter(e=>e.type==='expense_logged' && inPeriod(e.ts)).length;

  return {
    totalUsers, newUsers: newUsers.length,
    activated, activationRate: totalUsers>=MIN_SAMPLE ? pct(activated,totalUsers) : null,
    decoderUsers: decoderSet.size, decoderRate: activated>=MIN_SAMPLE ? pct(decoderSet.size, activated) : null,
    committedUsers: committedSet.size, committedRate: activated>=MIN_SAMPLE ? pct(committedSet.size, activated) : null,
    sources, sweldoRefs,
    d1: retention(1), d7: retention(7),
    opens, expensesPeriod,
    eventsTotal: events.length,
  };
}

/* ---------------- render ---------------- */
function kpi(lab, big, sub, empty){
  return `<div class="kpi signal"><div class="lab">${lab}</div>`
    + (big===null
        ? `<div class="empty">${empty||('Not enough data yet (need ≥'+MIN_SAMPLE+' users)')}</div>`
        : `<div class="big num">${big}</div>` + (sub?`<div class="sub">${sub}</div>`:''))
    + `</div>`;
}
function vanityKpi(lab, big, sub){
  return `<div class="kpi thin"><div class="lab">${lab}</div><div class="big num">${big}</div>${sub?`<div class="sub">${sub}</div>`:''}</div>`;
}

function render(m, days){
  // primary goal
  $('goal-count').textContent = m.activated;
  if(GOAL_TARGET){
    $('goal-bar').style.width = Math.min(100, pct(m.activated, GOAL_TARGET)) + '%';
    $('goal-note').textContent = `${m.activated} activated of a ${GOAL_TARGET} target.`;
  } else {
    $('goal-bar').style.width = '0%';
    $('goal-note').textContent = 'No target set yet. Pick a v2 number, then set GOAL_TARGET at the top of the script.';
  }

  const label = days>0 ? `last ${days} days` : 'all time';
  $('signal').innerHTML =
      kpi('New users <span class="sub" style="display:inline">('+label+')</span>', m.newUsers, `${m.totalUsers} total`)
    + kpi('Activation', m.activationRate===null?null:m.activationRate+'%', `${m.activated} of ${m.totalUsers} logged an expense`)
    + kpi('Salary decoder used', m.decoderRate===null?null:m.decoderRate+'%', `${m.decoderUsers} activated users tapped “use as income”`)
    + kpi('Committed bills set', m.committedRate===null?null:m.committedRate+'%', `${m.committedUsers} activated users have ≥1 recurring bill`)
    + kpi('From Sweldo', m.sweldoRefs, 'users whose source was Sweldo');

  $('retention').innerHTML =
      kpi('D1 retention', m.d1.rate===null?null:m.d1.rate+'%', `${m.d1.retained} of ${m.d1.eligible} came back next day`)
    + kpi('D7 retention', m.d7.rate===null?null:m.d7.rate+'%', `${m.d7.retained} of ${m.d7.eligible} came back day 7`);

  // funnel: users -> activated -> decoder -> committed
  const steps = [
    ['Signed up', m.totalUsers],
    ['Activated (logged an expense)', m.activated],
    ['Used the salary decoder', m.decoderUsers],
    ['Set a committed bill', m.committedUsers],
  ];
  const top = Math.max(1, m.totalUsers);
  $('funnel').innerHTML = steps.map(([l,v])=>`
    <div class="fstep">
      <div class="row"><span style="font-weight:600;font-size:13.5px">${l}</span><b class="num">${v}${top?` · ${pct(v,top)}%`:''}</b></div>
      <div class="fb" style="width:${Math.max(2, pct(v,top))}%"></div>
    </div>`).join('');

  // sources
  const srcRows = Object.entries(m.sources).sort((a,b)=>b[1]-a[1]);
  $('sources').innerHTML = srcRows.length
    ? srcRows.map(([s,n])=>`<div class="src${s.includes('sweldo')?' sweldo':''}"><span>${s}${s.includes('sweldo')?' ⭐':''}</span><b class="num">${n}</b></div>`).join('')
    : `<div class="empty">No acquisition sources tagged yet.</div>`;

  // vanity
  $('vanity').innerHTML =
      vanityKpi('App opens', m.opens.toLocaleString('en-PH'), label)
    + vanityKpi('Expenses logged', m.expensesPeriod.toLocaleString('en-PH'), label)
    + vanityKpi('Total events (all time)', m.eventsTotal.toLocaleString('en-PH'), '');

  $('foot').innerHTML = `Reads <code>events</code> and <code>profiles</code> from your Supabase project, live. `
    + `Rates hide below ${MIN_SAMPLE} users. Retention is cohort-based on each user's first-seen day. `
    + `If every number looks like one user, your RLS is only exposing your own rows — add an admin read policy or aggregate RPCs (see the note at the top of this file).`;
}

/* ---------------- boot ---------------- */
let RAW = null, DAYS = 28;
async function boot(){
  $('login').hidden = true; $('dash').hidden = false;
  $('report').hidden = true; $('loading').hidden = false;
  try{
    RAW = await fetchAll();
    $('lastload').textContent = 'Loaded ' + new Date().toLocaleString('en-PH');
    draw();
  }catch(e){
    $('loading').innerHTML = `<span class="err">Couldn't load: ${e.message}</span><br><span class="muted" style="font-size:12px">Most likely an RLS policy is blocking admin reads of <code>events</code>/<code>profiles</code>.</span>`;
  }
}
function draw(){
  if(!RAW) return;
  $('loading').hidden = true; $('report').hidden = false;
  render(compute(RAW.events, RAW.profiles, DAYS), DAYS);
}
$('refresh').addEventListener('click', boot);
$('period').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  DAYS = Number(b.dataset.d);
  [...$('period').children].forEach(x=>x.setAttribute('aria-pressed', String(x===b)));
  draw();
});

// already signed in? go straight to the dashboard
(async () => { const { data } = await sb.auth.getSession(); if(data && data.session) boot(); })();
</script>

</body>
</html>
